<style>
  :root {
    --bg:  #0C0B09; --bg2: #1C1916;
    --ora: #E8531A; --navy: #2A5298; --teal: #35AFA1;
    --text: #F0EDE8; --t2: rgba(240,237,232,.62); --t3: rgba(240,237,232,.3);
    --bdr: rgba(255,255,255,.08);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 52px 24px 72px;
  }
  h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: 2rem; letter-spacing: -.02em; margin-bottom: 6px; }
  h1 span { color: var(--ora); }
  .subtitle { font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: var(--t3); letter-spacing: .06em; margin-bottom: 52px; }
  svg { width: 100%; max-width: 1200px; display: block; }
  .legend {
    display: flex; gap: 28px; justify-content: center; flex-wrap: wrap;
    margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--bdr);
  }
  .li { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--t2); }
  .ld { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid; flex-shrink: 0; }
  .footer { margin-top: 32px; font-family: 'JetBrains Mono', monospace; font-size: .6rem; color: var(--t3); letter-spacing: .05em; }
</style>
</head>
